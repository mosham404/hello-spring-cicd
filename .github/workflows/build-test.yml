
name: Java Build and Test

on:
  workflow_dispatch:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with Maven
        run: mvn clean test "-DargLine=--add-opens=java.base/java.lang=ALL-UNNAMED"

      - name: Package application
        run: mvn package -DskipTests "-DargLine=--add-opens=java.base/java.lang=ALL-UNNAMED"
       
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar