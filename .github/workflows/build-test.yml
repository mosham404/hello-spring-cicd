
name: Java Build and Test

on:
  workflow_dispatch:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: write


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with Maven
        run: mvn clean test "-DargLine=--add-opens=java.base/java.lang=ALL-UNNAMED"

      - name: Package application
        run: mvn package -DskipTests "-DargLine=--add-opens=java.base/java.lang=ALL-UNNAMED"
       
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      - name: Prepare artifact for branch
        run: |
          mkdir -p artifact-output
          cp target/*.jar artifact-output/

      - name: Publish artifact to artefacts-store branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: artefacts-store
          FOLDER: artifact-output
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Store JAR artifact"